name: Integration Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      charm-path:
        type: string
        required: false
        default: '.'
      provider:
        type: string
        description: "The provider to choose for either machine or k8s tests ('lxd' or 'microk8s')"
        required: false
        default: 'microk8s'
      ip-range:
        type: string
        description: |
          The IP range in the address pool for the load balancer to use.
          It can be either a subnet(IP/mask) or a range (<IP1>-<IP2>)
        required: false
        default: null

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Charmcraft's pip cache
        uses: actions/cache@v4
        with:
          path: /home/runner/snap/charmcraft/common/cache/charmcraft/
          key: charmcraft-cache-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: charmcraft-cache
      - name: Get IP range
        id: ip_range
        if: ${{ inputs.ip-range == '' }}
        run: |
          echo "ip_range=$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc')/32" >> $GITHUB_OUTPUT
      - name: Setup operator enviroment (machine)
        if: inputs.provider == 'lxd'
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.4/stable
          provider: lxd
      - name: Setup operator environment (k8s)
        if: inputs.provider == 'microk8s'
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.4/stable
          provider: microk8s
          channel: 1.26-strict/stable
          microk8s-group: snap_microk8s
          microk8s-addons: "hostpath-storage dns metallb:${{ inputs.ip-range || steps.ip_range.outputs.ip_range }}"
      - name: Run integration tests
        run: cd ${{ inputs.charm-path }} && tox -vve integration -- --model testing --keep-models

      - name: Get oathkeeper container logs
        run: kubectl logs oathkeeper-0 -c oathkeeper -n testing
        if: failure()

      - name: Get juju status
        run: juju status --relations
        if: failure()

      - name: Get oathkeeper config file
        run: |
          juju ssh oathkeeper/0 "PYTHONPATH=agents/unit-oathkeeper-0/charm/venv/ python3 -c '
          from ops import pebble
          p = pebble.Client(\"/charm/containers/oathkeeper/pebble.socket\")
          f = p.pull(\"/etc/config/oathkeeper/oathkeeper.yaml\")
          print(f.read())
          '"
        if: failure()
      - name: Get oathkeeper allow access rules
        run: |
          juju ssh oathkeeper/0 "PYTHONPATH=agents/unit-oathkeeper-0/charm/venv/ python3 -c '
          from ops import pebble
          p = pebble.Client(\"/charm/containers/oathkeeper/pebble.socket\")
          f = p.pull(\"/etc/config/access-rules/access-rules-iap-requirer-allow.json\")
          print(f.read())
          '"
        if: failure()
      - name: Get oathkeeper deny access rules
        run: |
          juju ssh oathkeeper/0 "PYTHONPATH=agents/unit-oathkeeper-0/charm/venv/ python3 -c '
          from ops import pebble
          p = pebble.Client(\"/charm/containers/oathkeeper/pebble.socket\")
          f = p.pull(\"/etc/config/access-rules/access-rules-iap-requirer-deny.json\")
          print(f.read())
          '"
        if: failure()

      - name: Dump logs
        if: failure()
        uses: canonical/charming-actions/dump-logs@main
